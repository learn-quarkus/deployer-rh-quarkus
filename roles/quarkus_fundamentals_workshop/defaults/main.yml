become_override: false

silent: false
num_users: 1
guid: quarkus

ocp4_workload_authentication_htpasswd_user_base: user
ocp4_workload_authentication_htpasswd_user_count: 1
ocp4_workload_authentication_htpasswd_user_password: quarkus
quarkus_workshop_user_count: "{{ ocp4_workload_authentication_htpasswd_user_count }}"
quarkus_workshop_user_prefix: "{{ ocp4_workload_authentication_htpasswd_user_base }}"

# ------------------------------------------------
# Defaults for parmeters
# ------------------------------------------------

quarkus_workshop_install_app_of_apps: false
quarkus_workshop_install_openshift_gitops: false

workshop_user: "%USERID%"
workshop_password: default_password

# ------------------------------------------------
# Showroom
# ------------------------------------------------

quarkus_workshop_showroom_deployment_type: helm
quarkus_workshop_showroom_content_git_repo: https://github.com/rhpds/quarkus-openshift-showroom.git
quarkus_workshop_showroom_content_git_repo_ref: main
quarkus_workshop_showroom_content_only: true
quarkus_workshop_showroom_namespace: showroom
quarkus_workshop_showroom_host_prefix: ''
quarkus_workshop_openshift_api_internal: "https://172.30.0.1:443"

