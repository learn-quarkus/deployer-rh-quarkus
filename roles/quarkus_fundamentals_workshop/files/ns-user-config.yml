apiVersion: redhatcop.redhat.io/v1alpha1
kind: UserConfig
metadata:
  name: ns-user-config
spec:
  providerName: rhbk
  templates:
    - objectTemplate: |
        apiVersion: project.openshift.io/v1
        kind: Project
        metadata:
          name: {{ .Name | replace "@" "-" | replace "." "-" | lower }}-project
          labels:
            quarkus_user_project: "True"
          annotations:
            openshift.io/requester: {{ .Name }}
            project_basename: {{ .Name | replace "@" "-" | replace "." "-" | lower }}
            openshift.io/display-name: {{ .Name | replace "@" "-" | replace "." "-" | lower }}-project
            openshift.io/description: "Quarkus Fundamentals workshop project"
